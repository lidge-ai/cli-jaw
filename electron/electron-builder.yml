appId: com.lidge.cli-jaw
productName: cli-jaw
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# Runs before electron-builder signs the bundle. extraResources (the sidecar
# server tree) is never walked by its signing pass, so those Mach-O binaries
# have to be signed here or notarization rejects the upload.
afterPack: build/sign-extra-binaries.mjs
afterSign: build/after-sign.mjs
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
extraResources:
  - from: sidecar/server
    to: server
    filter:
      - "**/*"
      - "!**/*.ts"
      - "!**/*.map"
      - "!**/test*"
      - "!**/.cache"
  - from: build/icon.png
    to: icon.png
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
icon: build/icon.png
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  extendInfo:
    NSAppleEventsUsageDescription: cli-jaw uses Automation only when you ask Computer Use to inspect or operate another desktop app.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # Signing is decided by the environment, not hard-coded here.
  #
  # With a Developer ID Application identity, electron-builder signs with the
  # configured entitlements and hardened runtime; `notarize` is enabled by the signed
  # command (see electron:dist:mac:signed). Without an identity,
  # `electron:dist:mac` disables discovery, electron-builder skips mac signing
  # and therefore skips afterSign, and the later electron:resign:mac command
  # applies the final plain ad-hoc signature.
  #
  # That plain ad-hoc result has no Developer ID authority, secure timestamp or
  # hardened-runtime signing option. It is a local launch artifact, not a
  # rehearsal of the signed/notarized path; only the Developer ID path exercises
  # hardenedRuntime and these entitlements through electron-builder.
  gatekeeperAssess: false
  notarize: false
  hardenedRuntime: true
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
linux:
  target:
    - AppImage
  category: Development
publish:
  provider: github
  owner: lidge-ai
  repo: cli-jaw
