appId: com.lidge.cli-jaw
productName: cli-jaw
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
afterSign: build/after-sign.mjs
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
extraResources:
  - from: sidecar/server
    to: server
    filter:
      - "**/*"
      - "!**/*.ts"
      - "!**/*.map"
      - "!**/test*"
      - "!**/.cache"
  - from: build/icon.png
    to: icon.png
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
icon: build/icon.png
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  extendInfo:
    NSAppleEventsUsageDescription: cli-jaw uses Automation only when you ask Computer Use to inspect or operate another desktop app.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # Signing is decided by the environment, not hard-coded here.
  #
  # With CSC_LINK / CSC_IDENTITY_AUTO_DISCOVERY present, electron-builder finds
  # the Developer ID Application identity and signs for real; `notarize` is then
  # switched on from the command line (see electron:dist:mac:signed). Without
  # those, `electron:dist:mac` exports CSC_IDENTITY_AUTO_DISCOVERY=false and the
  # after-sign hook falls back to an ad-hoc signature, which is what local dev
  # builds have always produced.
  #
  # hardenedRuntime must stay on in both paths: notarization rejects a bundle
  # without it, and leaving it off only for unsigned builds would mean the
  # entitlements above go untested until release day.
  gatekeeperAssess: false
  notarize: false
  hardenedRuntime: true
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
linux:
  target:
    - AppImage
  category: Development
publish: null
