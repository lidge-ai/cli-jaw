name: Tests

on:
  push:
    branches:
      # `dev` runs the suite so its HEAD is never unverified live code (#521).
      # It does NOT become a release branch: publish.yml only accepts a
      # certifying Tests run from `preview`/`main` (see its headBranch filter),
      # and promote-to-main.sh pins `--branch preview`.
      - dev
      - preview
      - main
  # The pull_request contract is deliberately the minimal Linux set
  # (changes -> test, integration, gates -> ci-aggregate). Cross-platform lanes
  # — windows-unit and macos-unit — run on push to dev/preview/main and on
  # dispatch instead, so their evidence lands on the dev push after merge and a
  # red lane is fixed forward rather than blocking review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # publish.yml and the release scripts only accept `--event push` runs, so
  # a dispatch never certifies a release. Advisory coverage moved to its own
  # coverage-advisory.yml (weekly schedule + dispatch), so manual runs of this
  # workflow no longer include it.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This workflow carries no `paths-ignore` on purpose. A required status check
  # that is never produced for docs-only pull requests leaves them stuck on
  # "Expected — Waiting for status" forever. Draft PRs produce skipped job
  # records; admitted events run changes and the aggregate, with expensive
  # producers skipped only when the change is confirmed docs-only.
  changes:
    name: changes
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the push range and the pull-request merge base below
          # both need commits that a shallow clone does not have.
          fetch-depth: 0

      - name: Check private repository boundary
        run: node scripts/check-private-boundary.mjs

      - name: Determine code changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        # `-e` is off so every fallback below can be reached; each git call that
        # is allowed to fail is checked explicitly.
        run: |
          set -uo pipefail

          # Fail CLOSED. Every path that cannot *prove* the change is docs-only
          # reports code=true and runs the full suite. A wrong "docs-only"
          # verdict silently skips every release gate; a wrong "code" verdict
          # only costs runner minutes.
          emit() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "resolved code=$1"; }

          range_base=""
          range_head=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range_head="$PR_HEAD_SHA"
            # Diff against the merge base rather than the base branch tip, so
            # commits that landed on the base after this PR opened are not
            # attributed to this PR.
            if [ -n "$PR_BASE_SHA" ] && git rev-parse --verify --quiet "$PR_BASE_SHA^{commit}" >/dev/null; then
              range_base="$(git merge-base "$PR_BASE_SHA" "$range_head" 2>/dev/null || true)"
            fi
            if [ -z "$range_base" ] && [ -n "$PR_BASE_REF" ]; then
              git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" || true
              range_base="$(git merge-base "refs/remotes/origin/$PR_BASE_REF" "$range_head" 2>/dev/null || true)"
            fi
          else
            range_head="$HEAD_SHA"
            # github.event.before is the all-zeros SHA for the first push to a
            # ref (branch creation), where there is no previous commit to diff.
            case "$PUSH_BEFORE" in
              ''|0000000000000000000000000000000000000000)
                range_base=""
                ;;
              *)
                if git rev-parse --verify --quiet "$PUSH_BEFORE^{commit}" >/dev/null; then
                  range_base="$PUSH_BEFORE"
                fi
                ;;
            esac
          fi

          if [ -z "$range_base" ] || [ -z "$range_head" ]; then
            echo "::notice::no usable diff range (base='$range_base' head='$range_head') — running the full suite"
            emit true
            exit 0
          fi

          if ! changed="$(git diff --name-only "$range_base" "$range_head")"; then
            echo "::notice::git diff $range_base..$range_head failed — running the full suite"
            emit true
            exit 0
          fi

          echo "changed files ($range_base..$range_head):"
          echo "$changed"

          if [ -z "$changed" ]; then
            # An empty diff is not evidence of a docs-only change; it usually
            # means the range was wrong. Run the suite.
            echo "::notice::empty diff for a real range — running the full suite"
            emit true
            exit 0
          fi

          # Same set the old `paths-ignore` carried: top-level README*.md and
          # everything under docs/. Anything else — including this workflow —
          # counts as code.
          non_doc="$(echo "$changed" | grep -vE '^README[^/]*\.md$|^docs/' || true)"
          if [ -n "$non_doc" ]; then
            emit true
          else
            emit false
          fi

      # A missing or malformed classifier output must fail this job instead of
      # silently reading as "nothing changed" in every `== 'true'` condition.
      - name: Assert the scope output is usable
        env:
          CODE_SCOPE: ${{ steps.scope.outputs.code }}
        run: |
          case "$CODE_SCOPE" in
            true|false) echo "changes.outputs.code=$CODE_SCOPE" ;;
            *) echo "::error::changes.outputs.code was '$CODE_SCOPE', expected true or false"; exit 1 ;;
          esac

  # The suite, split by file across four Linux runners.
  #
  # tests/run.mts --shard i/N sorts the selected files in byte order and keeps
  # index % N === i-1 (tests/setup/shard.ts), so every runner computes the same
  # disjoint, complete partition without any coordination. Only the suite lives
  # here: typecheck, gates, build and the scans run once in `gates` and
  # `integration`, not four times. Ported from opencodex's ci.yml
  # (`test ${{ matrix.shard }}/4`, fail-fast: false); Bun batching and crash
  # retries were deliberately not carried — a shard that fails here failed a
  # test.
  test:
    name: test ${{ matrix.shard }}/4
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # A quarter of a suite that took 345s serially. A shard that needs longer
    # than this is wedged, not slow. The step below is roomy enough for the
    # driver's own stall watchdog to fire first and name the wedged file (#661);
    # this cap only catches a wedge the driver itself cannot see.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout public submodules
        run: |
          git submodule update --init skills_ref
          git submodule update --init officecli

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild better-sqlite3

      # Several unit tests execute dist/bin/cli-jaw.js (clone, launchd-multi,
      # electron-jaw-spawn …), so the compiled tree has to exist in every shard.
      - name: Build TypeScript
        run: npx tsc

      - name: Run shard
        shell: bash {0}
        env:
          TEST_SHARD: "${{ matrix.shard }}/4"
        run: |
          started=$(date +%s)
          npx tsx --experimental-test-module-mocks tests/run.mts --scope root,unit --shard "$TEST_SHARD"
          status=$?
          echo "shard $TEST_SHARD wall time: $(( $(date +%s) - started ))s (step limit: 480s)"
          exit $status
        # A shard takes ~160s. 480s leaves room for the driver's 180s stall watchdog to
        # fire and name the file before Actions kills the step with nothing to show.
        timeout-minutes: 8

  # Everything that needs a built package or a live server: the integration,
  # manager and bin suites (never run in CI before this job existed), the CLI
  # and API smokes that used to be separate steps, and the fresh-install smoke.
  #
  # Quarantined (self-skipping unless opted in; they need real provider auth
  # and inference, which CI does not have):
  #   tests/integration/agy-print-smoke.test.ts               JAW_AGY_SMOKE=1
  #   tests/integration/codex-app-multiplex-activation.test.ts  activation flag + CODEX_HOME auth
  integration:
    name: integration
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout public submodules
        run: |
          git submodule update --init skills_ref
          git submodule update --init officecli

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild better-sqlite3

      # `npm run build` (not bare tsc): graceful-shutdown boots dist/bin/cli-jaw.js,
      # which reads dist/src/prompt/templates — atomic-build.sh copies those,
      # tsc does not.
      - name: Build (atomic dist with assets)
        run: npm run build

      - name: Build frontend
        run: npm run build:frontend

      - name: Check frontend build output
        run: npm run check:frontend-build-output

      # api-smoke fails closed under CI when this server is missing
      # (tests/integration/api-smoke.test.ts), so a startup failure can never
      # turn into a green skip.
      - name: Start test server (port 3457)
        run: |
          node dist/server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3457/api/session > /dev/null 2>&1; then
              echo "✅ Server ready after $((i/2))s"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::server did not become ready on :3457"
          cat server.log
          exit 1

      - name: Integration, manager and bin suites
        env:
          TEST_PORT: "3457"
          CI: "true"
        run: npx tsx --experimental-test-module-mocks tests/run.mts --scope integration,manager,bin

      - name: Stop test server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Fresh install smoke (safe mode)
        run: npm run test:fresh-install

  # Fixed-cost checks, run exactly once: gate:all (which already includes
  # tsc --noEmit for server + frontend and the strict-baseline checker), the
  # dependency gates and the repo scans.
  gates:
    name: gates
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout public submodules
        run: |
          git submodule update --init skills_ref
          git submodule update --init officecli

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild better-sqlite3

      - name: Validate windows-unit manifest
        run: node scripts/ci/windows-unit-manifest.mjs

      - name: Validate macos-unit manifest
        run: node scripts/ci/macos-unit-manifest.mjs

      - name: Release gates (gate:all)
        run: npm run gate:all

      - name: Deps security check
        run: npm run check:deps

      - name: Dependency advisory gate
        run: npm run check:deps:audit

      - name: Copilot gap check
        run: npm run check:copilot-gap

      - name: File size check
        run: |
          echo "=== Files over 500 lines ==="
          find . \( -name '*.js' -o -name '*.ts' \) -not -path './node_modules/*' -not -path './skills_ref/*' -not -name '*.d.ts' \
            | xargs wc -l | sort -rn | awk '$1 > 500 && !/total/ { print "⚠️ " $0; found=1 } END { if (!found) print "✅ All files under 500 lines" }'

  # Windows unit lane, push/dispatch only (#384 added it to PRs; it moved off
  # pull_request when the PR contract was cut back to the minimal Linux set).
  # Before #384 Windows tests ran only in postinstall-platform.yml behind a
  # literal paths: allowlist, so a PR touching Windows behavior in unlisted
  # files merged with zero Windows CI. The file list lives in
  # scripts/ci/windows-unit-manifest.txt and is validated by
  # scripts/ci/windows-unit-manifest.mjs on Linux (gates job +
  # tests/unit/windows-unit-manifest.test.ts) and here, so a renamed test breaks
  # CI instead of silently vanishing from the lane. Windows evidence now lands
  # on the dev push after merge; a red lane is fixed forward.
  windows-unit:
    name: windows-unit
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # better-sqlite3 v13 ships prebuilds (win32-x64 included), so a source
      # rebuild is unnecessary here -- and node-gyp cannot detect the VS 2026
      # toolchain on windows-latest ("unknown version undefined"), so
      # `npm rebuild` hard-fails. Verify loadability instead and rebuild only
      # if the prebuild does not load, which is what the repo's own native
      # doctor already does.
      - name: Ensure native modules are loadable
        run: node scripts/ensure-native-modules.cjs

      # The validator prints the list; $LASTEXITCODE is checked immediately
      # because pwsh does not turn a native non-zero exit into a terminating
      # error, and any later native call would overwrite it. Arguments go
      # through one array so nothing is re-parsed by a shell.
      - name: Run Windows-relevant unit tests (manifest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(& node scripts/ci/windows-unit-manifest.mjs --print)
          if ($LASTEXITCODE -ne 0) { throw "windows-unit manifest validation failed ($LASTEXITCODE)" }
          if ($files.Count -eq 0) { throw 'windows-unit manifest is empty' }
          $tsx = (& node -p "require.resolve('tsx/cli')").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tsx) { throw 'cannot resolve the installed tsx' }
          $nodeArgs = @($tsx, '--import', './tests/setup/test-home.ts', '--experimental-test-module-mocks', '--test') + $files
          Write-Host "windows-unit: $($files.Count) files"
          & node @nodeArgs
          exit $LASTEXITCODE

  # macOS unit lane, push/dispatch only — the macOS twin of windows-unit.
  # Several suites can only prove anything on a real darwin host: launchd-plist
  # needs plutil, tcc.test.ts skips everywhere else, service-artifact's zsh
  # repin cases are darwin-gated, and platform-kind-runtime can only assert
  # `darwin` classification where the resolver genuinely runs on darwin. The
  # file list lives in scripts/ci/macos-unit-manifest.txt and is validated by
  # scripts/ci/macos-unit-manifest.mjs on Linux (gates job +
  # tests/unit/macos-unit-manifest.test.ts) and here, the same contract the
  # Windows manifest already carries.
  macos-unit:
    name: macos-unit
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout public submodules
        run: |
          git submodule update --init skills_ref
          git submodule update --init officecli

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Ensure native modules are loadable
        run: node scripts/ensure-native-modules.cjs

      # launchd-multi and db-* suites read dist/, so the compiled tree has to
      # exist before the manifest files run (same as the Linux shards).
      - name: Build TypeScript
        run: npx tsc

      # JAW_EXPECT_PLATFORM_KIND pins the expected real-runtime answer so a
      # scrubbed environment cannot keep the classification test green.
      - name: Run macOS-relevant unit tests (manifest)
        env:
          JAW_EXPECT_PLATFORM_KIND: darwin
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(node scripts/ci/macos-unit-manifest.mjs --print)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::macos-unit manifest is empty"; exit 1; }
          echo "macos-unit: ${#files[@]} files"
          npx tsx --import ./tests/setup/test-home.ts --experimental-test-module-mocks --test "${files[@]}"

  # The single required status check for the `main` ruleset.
  #
  # The check name is the job `name:` below and is load-bearing: the branch
  # ruleset matches on the literal string `ci-aggregate`. (publish.yml and the
  # release scripts select the whole run by workflow file, SHA, push event and
  # branch, not by this job name — but the ruleset does.) Renaming this job
  # silently detaches the ruleset, so the name is pinned explicitly instead of
  # being inherited from the job id.
  #
  # It runs on every admitted non-draft event, including docs-only pull requests
  # where the producers are legitimately skipped. Draft PRs skip this job too;
  # that skipped record is not passing test evidence. The decision table lives in
  # scripts/ci/aggregate-check.sh so tests/unit/ci-aggregate-rules.test.ts can
  # drive it; the checkout below is unconditional for that reason.
  ci-aggregate:
    name: ci-aggregate
    needs: [changes, test, integration, gates, windows-unit, macos-unit]
    # `always()` reports upstream failures on admitted events; the draft guard
    # also suppresses this aggregate when all producer jobs are skipped on a draft.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout aggregate script
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false

      - name: Verify producers
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          WINDOWS_UNIT_RESULT: ${{ needs.windows-unit.result }}
          MACOS_UNIT_RESULT: ${{ needs.macos-unit.result }}
        run: bash scripts/ci/aggregate-check.sh


  # Explicit final-candidate browser evidence; never part of push/PR admission.
  # Existing workflow registration supplies dispatch at a selected dev ref.
  hosted-manager-qa:
    name: Hosted Manager QA
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize external evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/jaw-hosted-qa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/artifacts"
          mkdir -p "$evidence"
          echo "QA_ARTIFACT_DIR=$evidence" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/jaw-qa-browsers" >> "$GITHUB_ENV"
          printf 'INCOMPLETE run=%s attempt=%s expected=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$EXPECTED_SHA" > "$evidence/preflight.log"
          actual="$(git rev-parse HEAD)"
          printf 'checkout=%s ref=%s\n' "$actual" "$GITHUB_REF" >> "$evidence/preflight.log"
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$actual" = "$EXPECTED_SHA"
          test "$actual" = "$GITHUB_SHA"

      # Node 24.16/24.17 stalls older Playwright extract-zip after download.
      # The stream compatibility fix ships in Node 24.18 (nodejs/node#63834).
      - name: Setup browser installer Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Provision locked browser dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          {
            node --version
            npm --version
            uname -a
            sha256sum package-lock.json
            npm ci --ignore-scripts
            node node_modules/playwright-core/cli.js install --with-deps chromium
            sudo apt-get install -y fonts-noto-cjk
            fc-match :lang=ko
          } 2>&1 | tee "$QA_ARTIFACT_DIR/provision.log"

      # Only installation uses 24.18; compile, native ABI checks and QA retain
      # the target sidecar runtime rather than silently changing certification.
      - name: Setup QA runtime Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.17.0

      - name: Build exact candidate without global linking
        shell: bash
        run: |
          set -euo pipefail
          {
            node --version
            npm run ensure:native
            npm run build --ignore-scripts
            bash scripts/verify-dist-assets.sh
            npm run build:frontend --ignore-scripts
            npm run check:frontend-build-output
          } 2>&1 | tee "$QA_ARTIFACT_DIR/build.log"

      - name: Run owned sequential Manager browser QA
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          node tests/helpers/hosted-manager-qa.mjs --expected-sha "$EXPECTED_SHA" --artifact-dir "$QA_ARTIFACT_DIR" 2>&1 | tee "$QA_ARTIFACT_DIR/supervisor.log"

      - name: Upload hosted QA evidence even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hosted-manager-qa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jaw-hosted-qa-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          if-no-files-found: error
          retention-days: 7
