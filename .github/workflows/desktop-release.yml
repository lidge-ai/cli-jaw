name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "GitHub release tag to build from and upload assets to"
        required: false
        type: string
      upload-release-assets:
        description: "Upload artifacts to the release-tag GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  desktop-release:
    name: Build ${{ matrix.platform }} desktop app
    runs-on: ${{ matrix.os }}
    concurrency:
      group: desktop-release-${{ inputs.release-tag || github.event.release.tag_name || github.run_id }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            sidecar_platform: darwin
            sidecar_arch: arm64
            sidecar_check_script: check:electron-dist-mac-no-jwc
            artifact_globs: |
              electron/dist/*.dmg
              electron/dist/*.zip
              electron/dist/*-mac.yml
              electron/dist/*.blockmap
          - platform: windows
            os: windows-2022
            script: dist:win
            sidecar_platform: win32
            sidecar_arch: x64
            sidecar_check_script: check:electron-dist-win-no-jwc
            artifact_globs: |
              electron/dist/*.exe
              electron/dist/*.msi
              electron/dist/*.zip
          - platform: linux
            os: ubuntu-latest
            script: dist:linux
            sidecar_platform: linux
            sidecar_arch: x64
            sidecar_check_script: check:electron-dist-linux-no-jwc
            artifact_globs: |
              electron/dist/*.AppImage
              electron/dist/*.deb
              electron/dist/*.rpm
              electron/dist/*.zip

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release-tag || github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      # node-gyp rebuilds the native node-pty module during packaging. The
      # bundled node-gyp still imports stdlib `distutils`, which Python 3.12+
      # removed (PEP 632). GitHub runners now default to 3.12+, so pin 3.11.
      - name: Setup Python 3.11 (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        # --ignore-scripts: postinstall-guard runs `bash atomic-build.sh` via cmd
        # on Windows and fails; bundle-sidecar.sh builds explicitly under bash.
        run: npm ci --ignore-scripts

      - name: Build server and bundle sidecar
        id: bundle-sidecar
        run: bash scripts/bundle-sidecar.sh "${{ matrix.sidecar_platform }}" "${{ matrix.sidecar_arch }}"

      # Failed smoke probes retain their issues/output in the owned build root.
      # Upload only the reports, never the source, dependencies or fixture homes.
      - name: Upload sidecar smoke evidence on failure
        if: failure() && steps.bundle-sidecar.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-smoke-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            electron/sidecar/.server-build.*/smoke-report.json
            electron/sidecar/.server-build.*/smoke-report.json.cleanup.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Install Electron dependencies
        run: npm ci --prefix electron

      - name: Type check Electron shell
        run: npm --prefix electron run typecheck

      - name: Build Electron shell
        run: npm --prefix electron run build

      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_APPLE_TEAM_ID: U9ATA49N28
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required macOS release credential is not configured: $name"
              exit 1
            fi
          done
          if [ "$APPLE_TEAM_ID" != "$EXPECTED_APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID does not match the release signing team"
            exit 1
          fi

      - name: Package signed and notarized macOS app
        if: matrix.platform == 'macos'
        run: npm --prefix electron run dist:mac -- --config.mac.notarize=true --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package unsigned Windows or Linux app
        if: matrix.platform != 'macos'
        run: npm --prefix electron run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify Developer ID signature and notarization ticket
        if: matrix.platform == 'macos'
        run: npm run verify:mac-signature
        env:
          VERIFY_EXPECTED_TEAM_ID: U9ATA49N28

      - name: Verify macOS update metadata and payload integrity
        if: matrix.platform == 'macos'
        run: npm run verify:electron-update-metadata

      # This is the only workflow that ends up with a built node-pty, so it is
      # the only place the probe can run for real: node-tests and publish
      # install root dependencies only.
      #
      # It has to come AFTER packaging. `npm ci --prefix electron` runs with
      # --ignore-scripts, so node-pty is unpacked without build/Release/pty.node;
      # electron-builder is what rebuilds the addon against the Electron ABI.
      # Running the gate before that step failed all three platforms on a
      # missing binary that nothing had built yet.
      #
      # Scoped to macOS and Windows for now. The Linux run reported both
      # `prebuilds present` and `pty spawn round-trip ok` and still failed,
      # and the reason was being swallowed by the gate runner (fixed in the
      # same change). Until a Linux run states an actual cause, this gate does
      # not get to block Linux artifacts on an unexplained verdict.
      - name: Native addon load gate
        if: matrix.platform != 'linux'
        run: npm run gate:native-load
        env:
          JAW_GATE_REQUIRE_NATIVE: '1'

      - name: Verify packaged app has no JWC payload
        run: npm run ${{ matrix.sidecar_check_script }}

      - name: Verify macOS app icons
        if: matrix.platform == 'macos'
        run: |
          npm run check:app-icons

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.msi
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/dist/*.zip
            electron/dist/*-mac.yml
            electron/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop assets to release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release-tag != '' && inputs.upload-release-assets == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release-tag || github.event.release.tag_name }}
          ARTIFACT_GLOBS: ${{ matrix.artifact_globs }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            for file in $pattern; do
              [ -f "$file" ] && files+=("$file")
            done
          done <<< "$ARTIFACT_GLOBS"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop assets found for ${{ matrix.platform }}."
            find electron/dist -maxdepth 2 -type f -print || true
            exit 1
          fi

          printf 'Uploading %s assets for %s:\n' "${#files[@]}" "${{ matrix.platform }}"
          printf ' - %s\n' "${files[@]}"
          gh release upload "$TAG_NAME" "${files[@]}" --clobber
