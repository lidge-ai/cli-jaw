name: npm Publish
run-name: "npm publish ${{ inputs.version }} (${{ inputs.tag }}) ${{ inputs.request-id }}"

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: "Unique request identifier"
        required: false
        type: string
      version:
        description: "Version to publish; must equal package.json"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        options:
          - preview
          - latest
        default: preview
      expected-sha:
        description: "SHA that must match the checked-out HEAD"
        required: true
        type: string
      dry-run:
        description: "Dry run: build, pack, and validate without publishing"
        required: false
        type: boolean
        default: true
      create-github-release:
        description: "Create a GitHub release after a real publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  # `gh workflow run` posts to .../actions/workflows/{id}/dispatches, which needs
  # `actions: write`. Declaring any permissions block sets every unlisted scope to
  # none, so the desktop dispatch below would fail with 403 without this line.
  actions: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs['dry-run'] }}
        run: |
          set -euo pipefail
          [ "$EVENT_NAME" = workflow_dispatch ] || { echo '::error::workflow_dispatch required'; exit 1; }
          # dev can move after certification; a tag keeps provenance on the built commit.
          if [ "$GITHUB_REF" != "refs/tags/v$INPUT_VERSION" ]; then
            [ "$GITHUB_REF" = refs/heads/dev ] && [ "$INPUT_DRY_RUN" = true ] || { echo '::error::real publishes require the matching version tag'; exit 1; }
          fi
          git fetch --no-tags --quiet origin +refs/heads/dev:refs/remotes/origin/dev
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/dev || { echo '::error::release SHA is not on dev'; exit 1; }

      - name: Check private repository boundary
        run: node scripts/check-private-boundary.mjs

      - name: Checkout public skill fixtures
        run: git submodule update --init --depth 1 skills_ref

      - name: Verify dispatched SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_SHA,,}"
          actual="${GITHUB_SHA,,}"
          if [ "$expected" != "$actual" ]; then
            echo "::error::branch moved after the release audit (expected ${expected}, got ${actual})"
            exit 1
          fi
          echo "Dispatched SHA matches checked-out HEAD."

      - name: Require successful Tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Scan the list: the newest run for this SHA may be a non-dev run,
          # and limiting the lookup to it would discard valid dev push proof.
          run_id="$(gh run list --workflow test.yml --commit "$GITHUB_SHA" --event push --status success --limit 100 --json databaseId,headSha,headBranch --jq '[.[] | select(.headSha == "'"$GITHUB_SHA"'") | select(.headBranch == "dev")] | .[0].databaseId // empty')"
          [ -n "$run_id" ] || { echo "::error::No successful dev push Tests run for $GITHUB_SHA"; exit 1; }
          echo "Found successful test run: $run_id"

      - name: Require successful Postinstall Platform Checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Any successful platform run for this exact SHA supplies the same proof.
          platform_url="$(gh run list --workflow postinstall-platform.yml --commit "$GITHUB_SHA" --status success --limit 100 --json url,headSha --jq '[.[] | select(.headSha == "'"$GITHUB_SHA"'")] | .[0].url // empty')"
          [ -n "$platform_url" ] || { echo "::error::No successful platform run for $GITHUB_SHA"; exit 1; }
          echo "platform certified by: $platform_url"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Use npm with provenance support
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve release config
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs['dry-run'] }}
          INPUT_CREATE_RELEASE: ${{ inputs['create-github-release'] }}
        run: |
          set -euo pipefail
          [ "$EVENT_NAME" = workflow_dispatch ] || { echo '::error::workflow_dispatch required'; exit 1; }
          version="$INPUT_VERSION"
          tag="$INPUT_TAG"
          dry_run="${INPUT_DRY_RUN:-true}"
          create_release="${INPUT_CREATE_RELEASE:-false}"
          pkg_version="$(node -p "require('./package.json').version")"
          [ "$pkg_version" = "$version" ] || { echo '::error::package.json version mismatch'; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]] || { echo '::error::invalid release version'; exit 1; }
          case "$tag:$version" in
            preview:*-preview.*|latest:[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo '::error::invalid channel or version'; exit 1;;
          esac
          if [ "$tag" = latest ] && [[ "$version" = *-* ]]; then echo '::error::latest requires a stable version'; exit 1; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dry-run=$dry_run"
            echo "create-release=$create_release"
          } >> "$GITHUB_OUTPUT"

      - name: Guard npm package metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sections = ['dependencies', 'optionalDependencies'];
          const offenders = [];
          for (const section of sections) {
            for (const [name, spec] of Object.entries(pkg[section] ?? {})) {
              if (String(spec).startsWith('file:')) offenders.push(`${section}.${name}=${spec}`);
            }
          }
          if (offenders.length) {
            console.error(`file: dependencies cannot be published:\n${offenders.join('\n')}`);
            process.exit(1);
          }
          console.log('package metadata OK');
          NODE

      - name: Build and package gates
        run: |
          set -euo pipefail
          npm run prepublishOnly
          npm run gate:all

      - name: Pack audit
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rawPack = JSON.parse(fs.readFileSync('/tmp/pack.json', 'utf8'));
          const pack = Array.isArray(rawPack)
            ? rawPack[0]
            : rawPack?.files
              ? rawPack
              : Object.values(rawPack ?? {})[0];
          if (!pack?.files) {
            console.error(`unexpected npm pack --json shape:\n${JSON.stringify(rawPack, null, 2).slice(0, 2000)}`);
            process.exit(1);
          }
          const forbidden = pack.files
            .map(file => file.path)
            .filter(path => /(^|\/)(devlog([._-][^/]*)?|cli-jaw-internal|\.jwc|_plan|_fin|skills_ref|officecli|node_modules)(\/|$)|\.node$/i.test(path));
          if (forbidden.length) {
            console.error(`forbidden files in npm pack:\n${forbidden.join('\n')}`);
            process.exit(1);
          }
          if (pack.size > 25_000_000) {
            console.error(`packed tarball too large: ${pack.size}`);
            process.exit(1);
          }
          console.log(`pack OK: ${pack.filename}, ${pack.files.length} files, ${pack.size} bytes`);
          NODE

      - name: Check registry package version
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          err="$(mktemp)"; trap 'rm -f "$err"' EXIT
          status=0
          value="$(npm view "cli-jaw@$RELEASE_VERSION" version 2>"$err")" || status=$?
          if [ "$status" -eq 0 ] && [ -n "$value" ]; then
            [ "$value" = "$RELEASE_VERSION" ] || { echo '::error::registry version mismatch'; exit 1; }
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ] && grep -Eq 'E404|npm (error|ERR!) 404' "$err"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$err" >&2; echo '::error::registry lookup failed'; exit 1
          fi

      - name: Assert dist-tag monotonic
        if: ${{ steps.registry.outputs.exists == 'false' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tags="$(npm view cli-jaw dist-tags --json)" || { echo '::error::dist-tag lookup failed'; exit 1; }
          latest="$(printf '%s' "$tags" | jq -er '.latest | select(type == "string" and length > 0)')"
          preview="$(printf '%s' "$tags" | jq -r '.preview // ""')"
          if [ "$RELEASE_TAG" = preview ]; then channel=preview; else channel=stable; fi
          node scripts/release-version.mjs assert-publishable --channel "$channel" --candidate "$RELEASE_VERSION" --latest "$latest" --preview "$preview"

      - name: Verify existing package provenance
        if: ${{ steps.registry.outputs.exists == 'true' && steps.release.outputs.dry-run != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git_head="$(npm view "cli-jaw@$RELEASE_VERSION" gitHead)"
          [ -n "$git_head" ] && [ "$git_head" = "$GITHUB_SHA" ] || { echo '::error::npm gitHead does not match release SHA'; exit 1; }
          NPM_INTEGRITY="$(npm view "cli-jaw@$RELEASE_VERSION" dist.integrity)"
          [ -n "$NPM_INTEGRITY" ] || { echo '::error::missing npm integrity'; exit 1; }
          export NPM_INTEGRITY
          node scripts/verify-npm-provenance.mjs

      - name: Publish or dry-run
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DRY_RUN: ${{ steps.release.outputs.dry-run }}
          EXISTS: ${{ steps.registry.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            npm publish --dry-run --tag "$RELEASE_TAG" --access public --provenance
          elif [ "$EXISTS" = true ]; then
            echo '::notice::package already published; recovery continues'
          else
            # npm publish cannot be undone. The tag was verified when the run
            # started, but it can be moved or deleted while the build runs, so
            # re-read it here: the version must still name the commit we built.
            remote_sha="$(git ls-remote origin "refs/tags/v$RELEASE_VERSION" | cut -f1)"
            [ "$remote_sha" = "$GITHUB_SHA" ] || { echo "::error::release tag v$RELEASE_VERSION no longer points at $GITHUB_SHA; refusing to publish"; exit 1; }
            npm publish --tag "$RELEASE_TAG" --access public --provenance
          fi

      - name: Create GitHub release
        if: ${{ steps.release.outputs.dry-run != 'true' && steps.release.outputs.create-release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXISTS: ${{ steps.registry.outputs.exists }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          remote_sha="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          [ "$remote_sha" = "$GITHUB_SHA" ] || { echo '::error::release tag moved or disappeared'; exit 1; }
          notes_file="$(mktemp)"; trap 'rm -f "$notes_file"' EXIT
          previous_tag="$(git tag --merged "$GITHUB_SHA" --no-contains "$GITHUB_SHA" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "$previous_tag" ]; then
            commit_count="$(git rev-list "$previous_tag..$GITHUB_SHA" --count)"
          else
            commit_count="$(git rev-list "$GITHUB_SHA" --count)"
          fi
          {
            echo "## Release $tag"
            echo
            echo "**Previous**: ${previous_tag:-(first release)}"
            echo "**Commits**: $commit_count"
            echo
            echo '### Changes'
            if [ -n "$previous_tag" ]; then git log "$previous_tag..$GITHUB_SHA" -n 80 --pretty=format:'- %s' --no-merges; else git log "$GITHUB_SHA" -n 80 --pretty=format:'- %s' --no-merges; fi
            echo
            echo
            echo '### Install'
            echo '```sh'
            echo "npm install -g cli-jaw@$RELEASE_TAG"
            echo "npm install -g cli-jaw@$RELEASE_VERSION"
            echo '```'
            echo
            echo '### Verification'
            echo "- Published from \`$REF_NAME\` with npm dist-tag \`$RELEASE_TAG\`."
            echo '- npm package gates passed in this workflow.'
            echo '- npm registry visibility is verified later in this workflow run.'
            echo '- npm provenance was requested through GitHub OIDC Trusted Publishing.'
            echo
            # Quoted heredoc: the backticks below are literal Markdown, not shell.
            cat <<'DESKTOP_NOTES'
          ### Desktop / Electron
          - Electron shell validated with `npm --prefix electron run typecheck` and `npm --prefix electron run build`.
          - npm package boundary validated with `npm run check:electron-no-native`; Electron app artifacts remain outside the npm package.
          - Desktop app distribution remains separate from `npm install -g cli-jaw`.
          - macOS, Windows, and Linux desktop assets are built by GitHub Actions after this release is published, then attached to this GitHub Release.

          #### Desktop signing and updates
          - macOS: Developer ID signed, Apple-notarized and stapled. The workflow verifies Team `U9ATA49N28`, Gatekeeper acceptance, update metadata and the ZIP SHA-512 before upload.
          - Updates: preview builds follow preview releases and stable builds follow stable releases. Download and restart/install require explicit confirmation. Existing unsigned installs must install this first signed DMG manually once.
          - Windows: artifacts remain unsigned. SmartScreen may warn on first run; click "More info" → "Run anyway".
          - Linux: AppImage downloads may need execute permission before launch.
          - CLI-only users can continue to install via `npm install -g cli-jaw`.
          DESKTOP_NOTES
          } > "$notes_file"
          args=()
          title="$tag"
          if [ "$RELEASE_TAG" = preview ]; then
            args+=(--prerelease)
            title="$tag (preview)"
          elif [ "$EXISTS" = false ]; then
            args+=(--latest)
          else
            latest="$(npm view cli-jaw dist-tags.latest)"
            [ -n "$latest" ] || { echo '::error::missing latest dist-tag'; exit 1; }
            if [ "$latest" = "$RELEASE_VERSION" ]; then args+=(--latest); else args+=(--latest=false); fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes_file" "${args[@]}"
          else
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --title "$title" --notes-file "$notes_file" "${args[@]}"
          fi

      # GITHUB_TOKEN-created releases do not emit release events, leaving
      # v2.17.57 and v2.17.58 without desktop assets. Dispatch both channels
      # explicitly so each release gets one pinned desktop build.
      - name: Dispatch Desktop Release
        if: ${{ steps.release.outputs.dry-run != 'true' && steps.release.outputs.create-release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run desktop-release.yml --ref "v$RELEASE_VERSION" -f "release-tag=v$RELEASE_VERSION" -f upload-release-assets=true -f "expected-sha=$GITHUB_SHA"

      # Runs last on purpose: npm publish is irreversible and registry visibility
      # has lagged by 100s, 9min and >15min. Never let that lag prevent GitHub
      # release creation or desktop dispatch after a successful publish.
      - name: Registry smoke
        if: ${{ steps.release.outputs.dry-run != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          err="$(mktemp)"; trap 'rm -f "$err"' EXIT
          for attempt in $(seq 1 90); do
            status=0
            version="$(npm view "cli-jaw@$RELEASE_VERSION" version 2>"$err")" || status=$?
            if [ "$status" -eq 0 ] && [ -n "$version" ]; then
              [ "$version" = "$RELEASE_VERSION" ] || { echo '::error::registry version mismatch'; exit 1; }
              npm dist-tag ls cli-jaw
              exit 0
            fi
            if [ "$status" -eq 0 ] || ! grep -Eq 'E404|npm (error|ERR!) 404' "$err"; then cat "$err" >&2; echo '::error::registry lookup failed'; exit 1; fi
            echo "::notice::package not visible yet ($attempt/90)"
            sleep 10
          done
          echo '::error::registry smoke failed'; exit 1
