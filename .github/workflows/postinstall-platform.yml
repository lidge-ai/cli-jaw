name: Postinstall Platform Checks

on:
  push:
    branches:
      # preview only. Promotion fast-forwards main onto the exact commit
      # preview already certified (#480), so a main push re-ran this workflow
      # against a byte-identical tree: no new information about the code, and a
      # second exposure to runner-side failure. Both post-promotion reds on main
      # were exactly that, with the preview run for the SAME sha green:
      #   729f0dca  Setup WSL   -> `wsl.exe --update` answered Forbidden (403)
      #   53eff414  where.exe   -> hit the 3s discovery budget (test ran 3126ms)
      # Every consumer resolves this workflow BY COMMIT, never by branch, so the
      # preview run still certifies main: publish.yml "Require platform checks
      # when installer surface changed", require-release-evidence.mjs
      # --accept-ci-evidence, and promote-to-main.sh which waits on the preview
      # run before it fast-forwards main. Branch protection on main requires
      # only ci-aggregate, which test.yml supplies.
      - preview
    paths:
      - '.gitattributes'
      - '.github/workflows/postinstall-platform.yml'
      - 'bin/postinstall.ts'
      - 'src/core/claude-install.ts'
      - 'src/core/cli-detect.ts'
      - 'src/core/platform-kind.ts'
      - 'src/core/runtime-path.ts'
      - 'scripts/install-risk-gate.mjs'
      - 'scripts/retired-runtime-package-smoke.mjs'
      - 'scripts/check-electron-sidecar-no-jwc.cjs'
      - 'tests/unit/retired-runtime-package.test.ts'
      - 'tests/unit/retired-runtime-command-contract.test.ts'
      - 'scripts/install.sh'
      - 'scripts/install-wsl.sh'
      - 'scripts/install-officecli.ps1'
      - 'scripts/fresh-install-smoke.ts'
      - 'scripts/verify-fresh-install.sh'
      - 'scripts/collect-fresh-install-evidence.sh'
      - 'scripts/audit-fresh-install-evidence.mjs'
      - 'scripts/verify-release-evidence.mjs'
      - 'scripts/require-release-evidence.mjs'
      - 'tests/unit/cli-detect.test.ts'
      - 'tests/unit/platform-kind.test.ts'
      - 'tests/unit/platform-kind-runtime.test.ts'
      - 'tests/unit/platform-kind-delegation.test.ts'
      - 'tests/unit/windows-native-cli-detect.test.ts'
      - 'tests/unit/doctor-platform-lanes.test.ts'
      - 'tests/unit/install-sh-exec.test.ts'
      - 'tests/unit/fresh-evidence-audit.test.ts'
      - 'tests/unit/safe-install.test.ts'
      - 'tests/unit/service.test.ts'
      - 'tests/unit/postinstall-strict-tools.test.ts'
      - 'tests/unit/wsl-installer-doctor.test.ts'
      - 'tests/unit/wsl-installer-exec.test.ts'
      - 'src/core/install-integrity.ts'
      - 'scripts/install.ps1'
      - 'tests/windows/install-ps1-contract.ps1'
      - 'scripts/postinstall-guard.cjs'
      - 'scripts/ensure-native-modules.cjs'
      - 'scripts/bundle-sidecar.sh'
      - 'bin/cli-jaw.ts'
      - 'bin/commands/init.ts'
      - 'bin/commands/doctor.ts'
      - 'Dockerfile'
      - 'Dockerfile.dev'
      - 'structure/infra.md'
      - 'tests/unit/install-integrity.test.ts'
      - 'tests/unit/scriptless-install-contract.test.ts'
      - 'tests/unit/installer-sensitive-path-parity.test.ts'
      # Windows-critical surfaces (#371). Without these, editing the shim resolver,
      # the stream decoder, or the bootstrap manifest would NOT run the only job that
      # executes them on a real Windows runner.
      - 'src/agent/spawn.ts'
      - 'src/agent/spawn-env.ts'
      - 'src/agent/stream-text.ts'
      - 'src/agent/args.ts'
      - 'src/core/windows-launch-spec.ts'
      - 'src/core/windows-shell-fallback.ts'
      - 'src/core/windows-bootstrap.ts'
      - 'src/core/windows-shell.ts'
      - 'src/core/instance-identity.ts'
      - 'src/manager/windows-service.ts'
      - 'scripts/windows-bootstrap-manifest.json'
      - 'scripts/windows-support-contract.json'
      - 'scripts/render-windows-support.mts'
      - 'tests/unit/spawn-env.test.ts'
      - 'tests/unit/stream-decode-boundary.test.ts'
      - 'tests/unit/windows-launch-spec.test.ts'
      - 'tests/unit/windows-shell-fallback.test.ts'
      - 'tests/unit/windows-bootstrap.test.ts'
      - 'tests/unit/instance-identity.test.ts'
      - 'tests/unit/install-ps1-hardening.test.ts'
      - 'tests/unit/readme-windows-parity.test.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.gitattributes'
      - '.github/workflows/postinstall-platform.yml'
      - 'bin/postinstall.ts'
      - 'src/core/claude-install.ts'
      - 'src/core/cli-detect.ts'
      - 'src/core/platform-kind.ts'
      - 'src/core/runtime-path.ts'
      - 'scripts/install-risk-gate.mjs'
      - 'scripts/retired-runtime-package-smoke.mjs'
      - 'scripts/check-electron-sidecar-no-jwc.cjs'
      - 'tests/unit/retired-runtime-package.test.ts'
      - 'tests/unit/retired-runtime-command-contract.test.ts'
      - 'scripts/install.sh'
      - 'scripts/install-wsl.sh'
      - 'scripts/install-officecli.ps1'
      - 'scripts/fresh-install-smoke.ts'
      - 'scripts/verify-fresh-install.sh'
      - 'scripts/collect-fresh-install-evidence.sh'
      - 'scripts/audit-fresh-install-evidence.mjs'
      - 'scripts/verify-release-evidence.mjs'
      - 'scripts/require-release-evidence.mjs'
      - 'tests/unit/cli-detect.test.ts'
      - 'tests/unit/platform-kind.test.ts'
      - 'tests/unit/platform-kind-runtime.test.ts'
      - 'tests/unit/platform-kind-delegation.test.ts'
      - 'tests/unit/windows-native-cli-detect.test.ts'
      - 'tests/unit/doctor-platform-lanes.test.ts'
      - 'tests/unit/install-sh-exec.test.ts'
      - 'tests/unit/fresh-evidence-audit.test.ts'
      - 'tests/unit/safe-install.test.ts'
      - 'tests/unit/service.test.ts'
      - 'tests/unit/postinstall-strict-tools.test.ts'
      - 'tests/unit/wsl-installer-doctor.test.ts'
      - 'tests/unit/wsl-installer-exec.test.ts'
      - 'src/core/install-integrity.ts'
      - 'scripts/install.ps1'
      - 'tests/windows/install-ps1-contract.ps1'
      - 'scripts/postinstall-guard.cjs'
      - 'scripts/ensure-native-modules.cjs'
      - 'scripts/bundle-sidecar.sh'
      - 'bin/cli-jaw.ts'
      - 'bin/commands/init.ts'
      - 'bin/commands/doctor.ts'
      - 'Dockerfile'
      - 'Dockerfile.dev'
      - 'structure/infra.md'
      - 'tests/unit/install-integrity.test.ts'
      - 'tests/unit/scriptless-install-contract.test.ts'
      - 'tests/unit/installer-sensitive-path-parity.test.ts'
      # Windows-critical surfaces (#371). Without these, editing the shim resolver,
      # the stream decoder, or the bootstrap manifest would NOT run the only job that
      # executes them on a real Windows runner.
      - 'src/agent/spawn.ts'
      - 'src/agent/spawn-env.ts'
      - 'src/agent/stream-text.ts'
      - 'src/agent/args.ts'
      - 'src/core/windows-launch-spec.ts'
      - 'src/core/windows-shell-fallback.ts'
      - 'src/core/windows-bootstrap.ts'
      - 'src/core/windows-shell.ts'
      - 'src/manager/windows-service.ts'
      - 'src/core/instance-identity.ts'
      - 'scripts/windows-bootstrap-manifest.json'
      - 'scripts/windows-support-contract.json'
      - 'scripts/render-windows-support.mts'
      - 'tests/unit/spawn-env.test.ts'
      - 'tests/unit/stream-decode-boundary.test.ts'
      - 'tests/unit/windows-launch-spec.test.ts'
      - 'tests/unit/windows-shell-fallback.test.ts'
      - 'tests/unit/windows-bootstrap.test.ts'
      - 'tests/unit/instance-identity.test.ts'
      - 'tests/unit/install-ps1-hardening.test.ts'
      - 'tests/unit/readme-windows-parity.test.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postinstall-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux postinstall policy
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Run postinstall policy tests
        run: npx tsx --import ./tests/setup/test-home.ts --experimental-test-module-mocks --test tests/unit/cli-detect.test.ts tests/unit/safe-install.test.ts

      - name: Run install-integrity contract tests
        run: npx tsx --experimental-test-module-mocks tests/run.mts tests/unit/install-integrity.test.ts tests/unit/scriptless-install-contract.test.ts

      - name: Scriptless global install smoke (Linux)
        run: |
          set -euo pipefail
          npm run build
          npm pack
          TGZ="$(ls cli-jaw-*.tgz | head -n1)"
          PREFIX="$(mktemp -d)"
          npm install -g --ignore-scripts --prefix "$PREFIX" "./$TGZ"
          "$PREFIX/bin/jaw" --version
          # --version skips the native guard, so open the native addon + vec
          # extension from the installed root — that is the real scriptless proof.
          PKG_ROOT="$PREFIX/lib/node_modules/cli-jaw"
          node -e "const {createRequire}=require('module');const r=createRequire(process.argv[1]+'/package.json');const D=r('better-sqlite3');const db=new D(':memory:');const v=r('sqlite-vec');v.load(db);console.log('native+vec OK', db.prepare('select vec_version() as x').get().x);db.close()" "$PKG_ROOT"

  macos-installer-risk:
    name: macOS installer risk gate
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run installer risk gate
        run: npm run test:install-risk

      - name: Build package
        run: npm run build

      - name: Verify packed package has no retired runtime
        run: npm run smoke:retired-runtime:package

      - name: Smoke packaged global install
        run: npm run test:fresh-install -- --postinstall --skip-doctor

      - name: Scriptless global install smoke (macOS)
        run: |
          set -euo pipefail
          npm pack
          TGZ="$(ls cli-jaw-*.tgz | head -n1)"
          PREFIX="$(mktemp -d)"
          npm install -g --ignore-scripts --prefix "$PREFIX" "./$TGZ"
          "$PREFIX/bin/jaw" --version
          PKG_ROOT="$PREFIX/lib/node_modules/cli-jaw"
          node -e "const {createRequire}=require('module');const r=createRequire(process.argv[1]+'/package.json');const D=r('better-sqlite3');const db=new D(':memory:');const v=r('sqlite-vec');v.load(db);console.log('native+vec OK', db.prepare('select vec_version() as x').get().x);db.close()" "$PKG_ROOT"

  windows-wsl:
    name: Windows WSL postinstall policy
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # windows-2025, not windows-2022, and the reason is inside the action rather
    # than the image. setup-wsl v7.0.0 calls `wsl.exe --update` from
    # installDistribution only when ALL of these hold (SetupWsl.kt:420-427):
    #   wslVersion() != 1 && ImageOS == "win22" && RUNNER_ARCH == X64
    #   && RUNNER_ENVIRONMENT == "github-hosted"
    # That call is a win22-specific WSL2 kernel workaround, and it reaches a
    # Microsoft endpoint we do not control. It answered `Forbidden (403)` on
    # 729f0dca (run 34624568593) and hung for 30 minutes on f8a6aac7 until the
    # job was cancelled (run 34668399466 attempt 1); the same tree passed on
    # attempt 2. Retry.kt at that tag re-invokes with no delay, so ten attempts
    # burned two seconds against a deterministic 403.
    # Leaving win22 makes the guard false while KEEPING WSL2. The alternative,
    # `wsl-version: '1'`, also makes it false but certifies the installer against
    # WSL1's translation layer instead of the WSL2 VM that real users run, and
    # src/core/platform-kind.ts does not distinguish them — the suite would stay
    # green on weaker evidence. That stays the recorded fallback, not the default.
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup WSL
        # v7's Ubuntu 24.04.4 .wsl delivery stalled before installation on
        # three independent heads. Pin the prior 24.04.0 AppX delivery path;
        # keep genuine WSL2 and every downstream installer assertion unchanged.
        uses: Vampire/setup-wsl@887f39deb6c0976365e546926fe66f41b77d65ff # v6.1.0
        # Bounds a hang, rather than buying a pass: the job may still take 25
        # minutes, but provisioning that stops answering fails in 5 instead of
        # consuming the whole budget and reporting as a cancellation.
        timeout-minutes: 5
        with:
          distribution: Ubuntu-24.04
          use-cache: 'false'
          additional-packages: curl ca-certificates gnupg

      - name: Install Node.js in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm ci --ignore-scripts

      - name: Type check in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npx tsc --noEmit

      # Asserts the LINUX side of the boundary on a genuine WSL process. The
      # expectation is pinned rather than inferred: without JAW_EXPECT_PLATFORM_KIND
      # a scrubbed WSL_DISTRO_NAME would let the test accept plain `linux`, so a
      # resolver regression could keep this job green.
      - name: Assert real-runtime classification inside WSL
        shell: wsl-bash {0}
        env:
          JAW_EXPECT_PLATFORM_KIND: wsl
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          JAW_EXPECT_PLATFORM_KIND=wsl npx tsx --test tests/unit/platform-kind-runtime.test.ts

      - name: Run installer risk gate in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm run test:install-risk

      - name: Build package in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm run build

      - name: Verify packed package has no retired runtime in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm run smoke:retired-runtime:package

      - name: Smoke packaged global install in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm run test:fresh-install -- --postinstall --skip-doctor

      - name: Smoke PowerShell to WSL login shell
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $workspaceForWsl = $workspace -replace '\\', '/'
          $linuxWorkspace = (wsl.exe -d Ubuntu-24.04 -- wslpath "$workspaceForWsl").Trim()
          if (-not $linuxWorkspace) { throw "wslpath returned an empty workspace path" }
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd '$linuxWorkspace' && npm run test:fresh-install -- --postinstall --skip-doctor"

  windows-native:
    name: Windows native install.ps1 (beta)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Run platform detection tests on native Windows
        run: npx tsx --test tests/unit/platform-kind.test.ts tests/unit/platform-kind-delegation.test.ts tests/unit/windows-native-cli-detect.test.ts tests/unit/doctor-platform-lanes.test.ts

      # The injected-fixture tables above prove the same thing on every OS.
      # This one calls the resolver with NO arguments, so it is the only step
      # that proves correctness when process.platform genuinely is win32.
      - name: Assert real-runtime classification on native Windows
        env:
          JAW_EXPECT_PLATFORM_KIND: windows-native
        run: npx tsx --test tests/unit/platform-kind-runtime.test.ts
      # These units are Windows-critical but were only ever exercised on Linux.
      # Running them here catches the failures that only a real Windows host shows:
      # CRLF handling, path separators, case-insensitive filesystem behavior, and
      # anything the Node build differs on. It does NOT prove real .cmd/PATHEXT or
      # runtime launch behavior — several of these suites still use injected win32
      # fixtures or inspect source. That gap is why #371 stays open until the
      # native evidence collector and runtime matrix land (#371).
      - name: Run Windows-critical unit tests on native Windows
        run: npx tsx --test tests/unit/spawn-env.test.ts tests/unit/stream-decode-boundary.test.ts tests/unit/windows-launch-spec.test.ts tests/unit/windows-shell-fallback.test.ts tests/unit/windows-bootstrap.test.ts tests/unit/instance-identity.test.ts tests/unit/install-ps1-hardening.test.ts tests/unit/readme-windows-parity.test.ts

      - name: Validate installer contracts in PowerShell 7
        shell: pwsh
        run: ./tests/windows/install-ps1-contract.ps1
      - name: Validate installer contracts in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\install-ps1-contract.ps1

      # NOTE: tests/unit/cli-detect.test.ts is intentionally NOT run here. Its
      # fixtures depend on the POSIX executable bit (chmod), which Windows does
      # not have, so those cases are POSIX-only by construction. Real where.exe
      # discovery is covered by the win32-gated cases inside
      # windows-native-cli-detect.test.ts, which run in the step above.
      - name: Build package
        run: npm run build

      - name: Run install.ps1 against the packed tarball (isolated prefix)
        shell: pwsh
        run: |
          npm pack
          $tgz = Get-ChildItem cli-jaw-*.tgz | Select-Object -First 1
          $prefix = Join-Path $env:RUNNER_TEMP "jaw-prefix"
          # Executes the beta installer itself so its npm version gate, PATH
          # diagnosis, and error handling actually run — not just raw npm.
          pwsh -NoProfile -File scripts/install.ps1 -TarballPath $tgz.FullName -Prefix $prefix -IgnoreScripts
          & (Join-Path $prefix "jaw.cmd") --version
          # --version skips the native guard; opening the addon + vec extension
          # from the installed root is the real scriptless proof on Windows.
          $pkgRoot = Join-Path $prefix "node_modules\cli-jaw"
          node -e "const {createRequire}=require('module');const r=createRequire(process.argv[1]+'/package.json');const D=r('better-sqlite3');const db=new D(':memory:');const v=r('sqlite-vec');v.load(db);console.log('native+vec OK', db.prepare('select vec_version() as x').get().x);db.close()" $pkgRoot

  # Informational rollup only (#384). DO NOT make this a required check: the
  # workflow-level paths: filters mean no run exists at all for PRs that touch
  # none of the listed paths, so a branch ruleset requiring this name would
  # leave those PRs waiting for a status forever. Release gates consume this
  # workflow at run level (gh run list --workflow), which stays the contract.
  platform-aggregate:
    name: platform-aggregate
    needs: [linux, macos-installer-risk, windows-wsl, windows-native]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify platform jobs
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos-installer-risk.result }}
          WSL_RESULT: ${{ needs.windows-wsl.result }}
          NATIVE_RESULT: ${{ needs.windows-native.result }}
        run: |
          failed=0
          # All four producers are expected to execute on admitted non-draft
          # and dispatch events. Drafts suppress this aggregate too. The legacy
          # skipped branch remains; final-tip proof requires each producer success.
          check() {
            case "$2" in
              success|skipped) echo "$1: $2" ;;
              *) echo "::error::$1: $2"; failed=1 ;;
            esac
          }
          check linux "$LINUX_RESULT"
          check macos-installer-risk "$MACOS_RESULT"
          check windows-wsl "$WSL_RESULT"
          check windows-native "$NATIVE_RESULT"
          if [ "$failed" -ne 0 ]; then
            echo "::error::platform-aggregate failed - see the per-job results above"
            exit 1
          fi
          echo "platform-aggregate: all platform jobs succeeded or were legitimately skipped"
